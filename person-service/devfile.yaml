commands:
- exec:
    commandLine: kill $(pidof dotnet); dotnet build -c $CONFIGURATION $STARTUP_PROJECT
      /p:UseSharedCompilation=false
    component: dotnet
    group:
      isDefault: true
      kind: build
    workingDir: ${PROJECT_SOURCE}
  id: build
- exec:
    commandLine: dotnet run -c $CONFIGURATION --no-build --project $STARTUP_PROJECT
      --no-launch-profile
    component: dotnet
    group:
      isDefault: true
      kind: run
    workingDir: ${PROJECT_SOURCE}
  id: run
components:
- container:
    args:
    - tail
    - -f
    - /dev/null
    endpoints:
    - name: https-dotnet90
      protocol: https
      targetPort: 8080
      exposure: public
    env:
    - name: CONFIGURATION
      value: Debug
    - name: STARTUP_PROJECT
      value: person-service.csproj
    - name: ASPNETCORE_ENVIRONMENT
      value: Development
    - name: ASPNETCORE_URLS
      value: http://*:8080
    image: registry.access.redhat.com/ubi8/dotnet-90:9.0
    mountSources: true
  name: dotnet
- name: postgresql
  container:
    image: registry.redhat.io/rhel9/postgresql-15
    env:
      - name: POSTGRESQL_USER
        value: dotnet
      - name: POSTGRESQL_PASSWORD
        value: dotnet123
      - name: POSTGRESQL_DATABASE
        value: sampledb
    endpoints:
      - name: postgresql
        exposure: internal
        targetPort: 5432
        attributes:
          discoverable: 'true'
    memoryLimit: 512Mi
    mountSources: true
    volumeMounts:
      - name: postgresql-storage
        path: /var/lib/postgresql/data
- name: postgresql-storage
  volume:
    size: 256Mi
- name: rabbitmq
  container:
    image: docker.io/library/rabbitmq:3-management
    env:
      - name: RABBITMQ_DEFAULT_USER
        value: dotnet
      - name: RABBITMQ_DEFAULT_PASS
        value: dotnet123
      - name: RABBITMQ_DEFAULT_VHOST
        value: /
    endpoints:
      - name: rabbitmq-amqp
        exposure: internal
        targetPort: 5672
        attributes:
          discoverable: 'true'
      - name: rabbitmq-mgmt
        exposure: internal
        targetPort: 15672
    memoryLimit: 512Mi
    mountSources: false
    volumeMounts:
      - name: rabbitmq-storage
        path: /var/lib/rabbitmq
- name: rabbitmq-storage
  volume:
    size: 256Mi
metadata:
  description: .NET 7.0 application
  displayName: .NET 7.0
  icon: https://github.com/dotnet/brand/raw/main/logo/dotnet-logo.png
  language: .NET
  name: person-service
  projectType: dotnet
  tags:
  - .NET
  - .NET 9.0
  version: 1.0.3
schemaVersion: 2.2.0
